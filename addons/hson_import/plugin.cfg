[plugin]

name="HSON Import"
description="Imports Hedgehog Set Object Notation (HSON) layouts into Badnik Framework scenes using a vendored copy of libHSON-csharp. Adds an 'HsonImportNode' node type with editor buttons for importing/clearing, and correctly reconstructs HSON object parenting/instancing/scale."
author="Gnidel"
version="1.0.0"
script="HsonImportPlugin.cs"
